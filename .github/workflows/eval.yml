name: Eval

# Asks the real model every question in backend/evals/cases.yaml and fails if
# execution accuracy drops below the gate. Runs when the prompt, the SQL guard,
# the loaders or the eval set change, and weekly to catch model drift on
# Groq's side (that's how "FROM orders" slipped in once).
on:
  push:
    paths:
      - backend/app/services/llm_service.py
      - backend/app/services/sql_guard.py
      - backend/app/services/loaders/**
      - backend/evals/**
      - backend/requirements.txt
      - .github/workflows/eval.yml
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      EVAL_MIN_ACCURACY: "0.9"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: check for the model key
        id: key
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::notice title=eval skipped::Add a GROQ_API_KEY repository secret to run the text-to-SQL eval."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: eval (gate)
        if: steps.key.outputs.skip != 'true'
        run: python -m evals.run --report eval-report.json
      - name: ablation — same cases without column notes
        if: always() && steps.key.outputs.skip != 'true'
        run: python -m evals.run --only notes --no-notes --min-accuracy 0 --report eval-no-notes.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.skip != 'true'
        with:
          name: eval-reports
          path: backend/eval-*.json

name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            database_url: ""
          - database: postgres
            database_url: postgresql://insightiq:insightiq@localhost:5432/insightiq
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: insightiq
          POSTGRES_PASSWORD: insightiq
          POSTGRES_DB: insightiq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U insightiq"
          --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env:
          DATABASE_URL: ${{ matrix.database_url }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint src
      - run: npm run build

  # boots the whole stack (postgres, redis, api, worker, frontend) and pushes
  # a real upload through the queue
  compose:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: start stack
        run: |
          set -o pipefail
          docker compose up -d --build --wait --wait-timeout 300 2>&1 | tee compose-up.log
      - name: upload goes through the worker
        run: |
          set -euo pipefail
          ready=$(curl -sf http://localhost:8000/ready); echo "$ready"
          echo "$ready" | grep -q '"queue":"ok"'
          echo "$ready" | grep -q '"cache":"ok"'
          resp=$(curl -s -w '\n%{http_code}' -F "file=@samples/sales.csv" http://localhost:8000/api/upload)
          code=$(echo "$resp" | tail -1)
          id=$(echo "$resp" | head -1 | python3 -c "import sys,json; print(json.load(sys.stdin)['dataset_id'])")
          echo "upload -> $code ($id)"
          test "$code" = 202
          for i in $(seq 1 30); do
            status=$(curl -s http://localhost:8000/api/datasets/$id | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
            echo "status: $status"
            [ "$status" = ready ] && break
            [ "$status" = failed ] && exit 1
            sleep 1
          done
          test "$status" = ready
          curl -sf http://localhost:8080 | grep -q "<title>InsightIQ</title>"
      - name: rate limit is shared through redis
        run: |
          set -euo pipefail
          # uploads are capped at 10/minute per client; one is already spent above
          codes=$(for i in $(seq 1 10); do curl -s -o /dev/null -w '%{http_code} ' -F "file=@samples/sales.csv" http://localhost:8000/api/upload; done)
          echo "$codes"
          echo "$codes" | grep -q 429
          # the counters live in redis, not in the api process
          keys=$(docker compose exec -T redis redis-cli --scan --pattern 'iq:rl:upload:*')
          echo "$keys"
          test -n "$keys"
      - name: logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color
          # also as annotations, which are readable without signing in
          esc() { python3 -c "import sys; print(sys.stdin.read()[-3500:].replace('%','%25').replace('\r','').replace('\n','%0A'))"; }
          [ -f compose-up.log ] && echo "::error title=compose up::$(esc < compose-up.log)"
          echo "::error title=compose ps::$(docker compose ps -a 2>&1 | esc)"
          for s in $(docker compose config --services); do
            echo "::error title=$s logs::$(docker compose logs --no-color --tail 40 $s 2>&1 | esc)"
          done
      - run: docker compose down -v
        if: always()

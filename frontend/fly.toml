app = "insightiq-web"
primary_region = "sin"

[build]
  [build.args]
    VITE_API_URL = "https://insightiq-api.fly.dev"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

app = "insightiq-api"
primary_region = "sin"

[build]

[env]
  UPLOAD_DIR = "/data/uploads"
  MAX_UPLOAD_MB = "50"
  MAX_RESULT_ROWS = "1000"
  QUERY_TIMEOUT_SECONDS = "20"
  DATASET_TTL_HOURS = "24"
  # Fly's proxy sets this to the real client IP (and overwrites any client value)
  CLIENT_IP_HEADER = "Fly-Client-IP"
  # set after the frontend is deployed:
  #   fly secrets set ALLOWED_ORIGINS=https://<your-app>.vercel.app
  # and the model key:
  #   fly secrets set GROQ_API_KEY=gsk_...

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

# Fly scrapes this into its managed Prometheus (dashboards at fly-metrics.net);
# the port isn't exposed publicly
[metrics]
  port = 9091
  path = "/metrics"

[[mounts]]
  source = "insightiq_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

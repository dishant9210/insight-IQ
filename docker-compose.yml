services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      - UPLOAD_DIR=/data/uploads
      - ALLOWED_ORIGINS=http://localhost:8080
    volumes:
      - insightiq_data:/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  insightiq_data:
